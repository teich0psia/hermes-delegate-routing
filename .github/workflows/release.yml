name: release

# Validates the release build when a version tag is pushed.
#
# NOTE: the PyPI publish job was intentionally removed (2026-09-07). The
# `hermes-delegate-routing` PyPI name belongs to the upstream fork's 0.1.x
# line, so this fork cannot publish under the same name, and no Trusted
# Publishing identity is configured. Releases are distributed as GitHub
# Releases with attached sdist/wheel artifacts (see `gh release create`).
# If PyPI distribution is ever wanted, it needs a new distribution name
# plus a pending-publisher setup — that is a separate, deliberate step.
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: uv build
      - name: Check metadata
        run: uv run --with twine twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
